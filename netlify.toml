# Static site — no build step. Netlify serves this folder as-is.
[build]
  publish = "."
  command = ""

# Photos and logos get swapped in place under the same filename (there is no
# build step adding content hashes), so a year-long immutable cache would
# strand returning visitors on an old image indefinitely. A short TTL with
# background revalidation keeps them current; Netlify's ETags make the
# revalidation a cheap 304 in almost every case.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Fonts are content-stable — the filename changes if the font does.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
